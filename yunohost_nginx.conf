# ==============================================================================
# CONFIGURATION NGINX YUNOHOST (BYPASS SSO RSS PODCAST & TIMEOUTS GENERATION)
# ==============================================================================
# Emplacement sur le VPS YunoHost :
# /etc/nginx/conf.d/votre_domaine.tld.d/vos_rss.conf
# (Remplacer 'votre_domaine.tld' par votre nom de domaine YunoHost)
#
# Une fois le fichier créé sur le VPS :
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

# 1. Timeout étendu pour la génération manuelle d'émission (Evite les erreurs 504)
location /api/podcast/generate {
    proxy_pass http://127.0.0.1:8000/api/podcast/generate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
}

# 2. Bypass SSO YunoHost pour le flux RSS XML Podcast (Priorité ^~)
location ^~ /api/podcast/feed.xml {
    access_by_lua_block { return; }
    proxy_pass http://127.0.0.1:8000/api/podcast/feed.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 3. Bypass SSO YunoHost pour les fichiers MP3 audio des podcasts (Priorité ^~)
location ^~ /api/audio/stream/ {
    access_by_lua_block { return; }
    proxy_pass http://127.0.0.1:8000/api/audio/stream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Support du streaming audio / Seek (Range requests)
    proxy_force_ranges on;
    proxy_read_timeout 300s;
}
